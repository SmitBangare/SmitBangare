name: Contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#1D4ED8&color_dots=#EDF1F4,#C7D7FE,#93B0FD,#5B85F5,#1D4ED8
            dist/snake-dark.svg?palette=github-dark&color_snake=#85A6FF&color_dots=#111A27,#1E2B44,#2D4677,#4F6FC0,#85A6FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
